<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07006c"/>
      <stop offset="100%" stop-color="#2f2ebe"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#dae2fd"/>
      <stop offset="100%" stop-color="#76dcff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Sparkle Star Group -->
  <g filter="url(#glow)">
    <!-- Main Center 4-Point Star -->
    <path d="M32 12 C32 23 34 25 45 25 C34 25 32 27 32 38 C32 27 30 25 19 25 C30 25 32 23 32 12 Z" fill="url(#starGrad)"/>
    
    <!-- Secondary Small Star Top Right -->
    <path d="M47 34 C47 39 48 40 53 40 C48 40 47 41 47 46 C47 41 46 40 41 40 C46 40 47 39 47 34 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Mini Star Bottom Left -->
    <circle cx="21" cy="42" r="2.5" fill="#76dcff" opacity="0.85"/>
  </g>
</svg>
